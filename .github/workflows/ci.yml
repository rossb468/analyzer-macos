name: CI

# macOS only, by nature. Everything portable lives in the core repository and is
# tested there on Linux, Windows and macOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: macos-latest

    steps:
      # The core is a submodule pinned to a revision, and the build needs it.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The C ABI is the boundary this repository sits on, so it is checked here
      # rather than in the core: a change that satisfies Rust and breaks Swift
      # should fail on the side that notices.
      - name: Clippy the FFI
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets --all-features -p analyzer-ffi

      - name: Test the FFI
        run: cargo test --manifest-path core/Cargo.toml --all-features -p analyzer-ffi

      # Builds the staticlib, regenerates the header through cbindgen, compiles
      # every Swift source against it and lays out the bundle. cbindgen rewrites
      # the header silently, so this is what catches an ABI change that Rust is
      # perfectly happy with and Swift is not.
      - name: Build the app
        run: ./build.sh

      # A bundle that builds and cannot launch is not a passing build. This is
      # as far as CI can go: there is no display, so the window never appears
      # and nothing about the interface itself is verified here.
      - name: Launch
        run: |
          open build/Analyzer.app
          sleep 10
          if pgrep -f "Analyzer.app/Contents/MacOS/Analyzer" > /dev/null; then
            echo "launched and still running"
            osascript -e 'quit app "Analyzer"' || true
          else
            echo "the app exited within 10 seconds of launching" >&2
            ls -t ~/Library/Logs/DiagnosticReports/Analyzer* 2>/dev/null | head -1 | xargs -r cat
            exit 1
          fi
